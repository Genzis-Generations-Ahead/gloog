<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="What Gloog senses, with current status of each capability">
  <defs>
    <style>
      .h{font-family:'Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:900}
      .t{font-family:'Helvetica Neue',Arial,sans-serif}
      .m{font-family:'SFMono-Regular',Consolas,'Courier New',monospace;font-weight:700}
      .blink{animation:b 1.4s ease-in-out infinite}
      @keyframes b{50%{opacity:.25}}
    </style>
  </defs>
  <rect width="1200" height="470" fill="#FFF4E4"/>

  <text x="40" y="58" class="h" font-size="34" fill="#111">WHAT IT SENSES</text>
  <rect x="40" y="72" width="230" height="8" rx="4" fill="#FF9BDB" stroke="#111" stroke-width="2"/>

  <!-- big card: CSI capture -->
  <g transform="translate(40 104)">
    <rect x="8" y="8" width="460" height="330" rx="18" fill="#111"/>
    <rect width="460" height="330" rx="18" fill="#C6FF3D" stroke="#111" stroke-width="4"/>
    <g transform="translate(24 24)"><rect width="96" height="30" rx="15" fill="#111"/><circle class="blink" cx="20" cy="15" r="6" fill="#C6FF3D"/><text x="58" y="20" class="m" font-size="13" fill="#C6FF3D" text-anchor="middle">LIVE</text></g>
    <text x="24" y="104" class="h" font-size="34" fill="#111">Wi-Fi CSI</text>
    <text x="24" y="142" class="h" font-size="34" fill="#111">capture</text>
    <text x="24" y="182" class="t" font-size="17" fill="#111">Raspberry Pi reads the fine-grained</text>
    <text x="24" y="204" class="t" font-size="17" fill="#111">channel of every Wi-Fi packet from</text>
    <text x="24" y="226" class="t" font-size="17" fill="#111">an ordinary router.</text>
    <g fill="#111">
      <rect x="24" y="260" width="10" height="40"/><rect x="40" y="248" width="10" height="52"/><rect x="56" y="270" width="10" height="30"/>
      <rect x="72" y="240" width="10" height="60"/><rect x="88" y="258" width="10" height="42"/><rect x="104" y="246" width="10" height="54"/>
      <rect x="120" y="266" width="10" height="34"/><rect x="136" y="252" width="10" height="48"/><rect x="152" y="262" width="10" height="38"/>
      <rect x="168" y="244" width="10" height="56"/><rect x="184" y="270" width="10" height="30"/><rect x="200" y="256" width="10" height="44"/>
    </g>
    <text x="436" y="300" class="m" font-size="13" fill="#111" text-anchor="end">64 subcarriers / packet</text>
  </g>

  <!-- presence -->
  <g transform="translate(528 104)">
    <rect x="8" y="8" width="300" height="156" rx="18" fill="#111"/>
    <rect width="300" height="156" rx="18" fill="#7CF5FF" stroke="#111" stroke-width="4"/>
    <g transform="translate(20 20)"><rect width="118" height="28" rx="14" fill="#FFFDF8" stroke="#111" stroke-width="3"/><text x="59" y="19" class="m" font-size="12" fill="#111" text-anchor="middle">PROTOTYPE</text></g>
    <text x="20" y="88" class="h" font-size="24" fill="#111">Presence &amp;</text>
    <text x="20" y="116" class="h" font-size="24" fill="#111">movement</text>
    <text x="20" y="140" class="t" font-size="15" fill="#111">is someone there? moving?</text>
  </g>

  <!-- breathing -->
  <g transform="translate(860 104)">
    <rect x="8" y="8" width="300" height="156" rx="18" fill="#111"/>
    <rect width="300" height="156" rx="18" fill="#B9A6FF" stroke="#111" stroke-width="4"/>
    <g transform="translate(20 20)"><rect width="118" height="28" rx="14" fill="#FFFDF8" stroke="#111" stroke-width="3"/><text x="59" y="19" class="m" font-size="12" fill="#111" text-anchor="middle">PROTOTYPE</text></g>
    <path d="M190 40 q12 -16 24 0 t24 0 t24 0" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
    <text x="20" y="88" class="h" font-size="24" fill="#111">Breathing</text>
    <text x="20" y="116" class="h" font-size="24" fill="#111">rate</text>
    <text x="20" y="140" class="t" font-size="15" fill="#111">chest motion, 0.1 – 0.6 Hz</text>
  </g>

  <!-- heart -->
  <g transform="translate(528 282)">
    <rect x="8" y="8" width="300" height="156" rx="18" fill="#111"/>
    <rect width="300" height="156" rx="18" fill="#FF9BDB" stroke="#111" stroke-width="4"/>
    <g transform="translate(20 20)"><rect width="130" height="28" rx="14" fill="#FFFDF8" stroke="#111" stroke-width="3"/><text x="65" y="19" class="m" font-size="12" fill="#111" text-anchor="middle">IN PROGRESS</text></g>
    <path d="M232 52 c-10 -18 -34 -8 -26 10 l26 24 l26 -24 c8 -18 -16 -28 -26 -10z" fill="#FFFDF8" stroke="#111" stroke-width="3"/>
    <text x="20" y="88" class="h" font-size="24" fill="#111">Heart rate</text>
    <text x="20" y="116" class="t" font-size="15" fill="#111">from CSI, validated against</text>
    <text x="20" y="138" class="t" font-size="15" fill="#111">the PPG reference band</text>
  </g>

  <!-- alerts -->
  <g transform="translate(860 282)">
    <rect x="8" y="8" width="300" height="156" rx="18" fill="#111"/>
    <rect width="300" height="156" rx="18" fill="#FFD166" stroke="#111" stroke-width="4"/>
    <g transform="translate(20 20)"><rect width="100" height="28" rx="14" fill="#FFFDF8" stroke="#111" stroke-width="3"/><text x="50" y="19" class="m" font-size="12" fill="#111" text-anchor="middle">PLANNED</text></g>
    <path d="M250 30 l20 36 h-40z" fill="#FFFDF8" stroke="#111" stroke-width="3" stroke-linejoin="round"/><path d="M250 44v10" stroke="#111" stroke-width="3"/><circle cx="250" cy="60" r="2" fill="#111"/>
    <text x="20" y="88" class="h" font-size="24" fill="#111">No-movement</text>
    <text x="20" y="116" class="h" font-size="24" fill="#111">alerts</text>
    <text x="20" y="140" class="t" font-size="15" fill="#111">for bed-bound patients</text>
  </g>
</svg>
