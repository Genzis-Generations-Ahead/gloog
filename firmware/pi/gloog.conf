# Gloog Pi capture settings. Edit these when you use a different router.
# Get channel + BSSID on Windows with:  netsh wlan show interfaces
# Router must be on a FIXED channel (not auto).

CHBW=6/20                      # channel/bandwidth, e.g. 6/20 (2.4 GHz) or 36/80 (5 GHz)
ROUTER_MAC=e8:65:d4:f6:0f:28   # router BSSID (Tenda N301 "gloog")
LAPTOP_IP=broadcast            # "broadcast" = send to whatever laptop is on the Ethernet cable
